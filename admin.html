<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>管理后台 · 刷题大专家</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-l: #eef2ff;
    --ink: #1e293b;
    --ink-2: #64748b;
    --ink-3: #94a3b8;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --green: #16a34a;
    --green-l: #f0fdf4;
    --red: #dc2626;
    --red-l: #fef2f2;
    --orange: #ea580c;
    --orange-l: #fff7ed;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }

  /* ===== 密码门 ===== */
  .gate-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .gate-card { background: var(--card); border-radius: var(--radius); padding: 36px 32px; max-width: 380px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
  .gate-card .ic { font-size: 48px; margin-bottom: 12px; }
  .gate-card h1 { font-size: 20px; margin-bottom: 8px; }
  .gate-card .sub { font-size: 13px; color: var(--ink-2); margin-bottom: 24px; }
  .gate-card input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 16px; outline: none; transition: border-color .2s; }
  .gate-card input:focus { border-color: var(--primary); }
  .btn { display: inline-block; padding: 10px 24px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: opacity .2s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-ghost { background: var(--bg); color: var(--ink-2); border: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== 仪表盘 ===== */
  .dashboard { display: none; }
  .dashboard.active { display: block; }
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar .brand { font-size: 18px; font-weight: 700; }
  .topbar .brand span { color: var(--primary); }
  .topbar .actions { display: flex; gap: 12px; align-items: center; }
  .topbar .actions button { padding: 8px 16px; font-size: 13px; }
  .refresh-btn { background: var(--primary-l); color: var(--primary); border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }

  /* 统计卡片 */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
  .stat-card .label { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .stat-card .value { font-size: 32px; font-weight: 700; color: var(--ink); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.primary { color: var(--primary); }
  .stat-card .extra { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

  /* 搜索栏 */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="text"] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
  .toolbar input[type="text"]:focus { border-color: var(--primary); }
  .toolbar select { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--card); cursor: pointer; }

  /* 用户表格 */
  .table-wrap { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: var(--bg); }
  th { padding: 12px 14px; text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--primary); }
  th .arrow { font-size: 10px; opacity: .5; }
  th.sorted .arrow { opacity: 1; color: var(--primary); }
  td { padding: 12px 14px; border-top: 1px solid var(--border); }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: var(--primary-l); }
  .td-user { font-weight: 600; }
  .td-num { text-align: center; font-variant-numeric: tabular-nums; }
  .rate-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .rate-high { background: var(--green-l); color: var(--green); }
  .rate-mid { background: var(--orange-l); color: var(--orange); }
  .rate-low { background: var(--red-l); color: var(--red); }
  .date-str { font-size: 12px; color: var(--ink-3); }
  .empty-row td { text-align: center; padding: 40px; color: var(--ink-3); }

  /* 移动端适配 */
  @media (max-width: 640px) {
    .container { padding: 12px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .stat-card { padding: 14px; }
    .stat-card .value { font-size: 24px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .hide-mobile { display: none; }
    .toolbar { flex-direction: column; }
    .toolbar input, .toolbar select { width: 100%; }
  }

  .loading { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .loading .spin { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { text-align: center; padding: 40px; color: var(--red); }
</style>
</head>
<body>

<!-- 密码门 -->
<div class="gate-wrap" id="gate">
  <div class="gate-card">
    <div class="ic">🔐</div>
    <h1>管理后台</h1>
    <div class="sub">请输入管理员密码</div>
    <input type="password" id="pwd-input" placeholder="管理员密码" autofocus>
    <button class="btn btn-primary" id="pwd-btn" style="width:100%">进 入</button>
    <div style="margin-top:16px">
      <a href="./" style="font-size:13px;color:var(--ink-3);text-decoration:none">← 返回刷题首页</a>
    </div>
  </div>
</div>

<!-- 仪表盘 -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="brand">📊 刷题大专家 <span>管理后台</span></div>
    <div class="actions">
      <button class="refresh-btn" id="refresh-btn">⟳ 刷新</button>
      <button class="btn btn-ghost" id="logout-btn">退出</button>
    </div>
  </div>
  <div class="container">
    <!-- 统计卡片 -->
    <div class="stats-grid" id="stats-grid"></div>
    <!-- 搜索栏 -->
    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索用户名…">
      <select id="sort-select">
        <option value="created_desc">注册时间 ↓</option>
        <option value="created_asc">注册时间 ↑</option>
        <option value="answered_desc">答题数 ↓</option>
        <option value="answered_asc">答题数 ↑</option>
        <option value="rate_desc">正确率 ↓</option>
        <option value="rate_asc">正确率 ↑</option>
        <option value="updated_desc">最近活跃 ↓</option>
      </select>
    </div>
    <!-- 表格 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>用户名</th>
            <th class="hide-mobile">注册时间</th>
            <th class="hide-mobile">最后同步</th>
            <th class="td-num">已答题</th>
            <th class="td-num">正确数</th>
            <th class="td-num">正确率</th>
            <th class="td-num">错题</th>
          </tr>
        </thead>
        <tbody id="user-tbody"></tbody>
      </table>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--ink-3);margin-top:16px">
      数据来源：Supabase 云端 · 仅显示已注册并同步过进度的用户
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
